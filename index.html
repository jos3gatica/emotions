<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberEmotion AI - Detector de Estados de Ánimo</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#080c14',
              dark: '#0f172a',
              cyan: '#06b6d4',
              green: '#10b981',
              accent: '#3b82f6'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & face-api.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-cyber-black text-slate-200 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-black">

  <!-- Header -->
  <header class="border-b border-cyan-900/40 bg-slate-900/80 backdrop-blur sticky top-0 z-50 py-4 px-6">
    <div class="max-w-7xl mx-mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-cyan-950 border border-cyan-500/40 rounded-lg shadow-[0_0_15px_rgba(6,182,212,0.2)]">
          <i data-lucide="scan-face" class="w-6 h-6 text-cyan-400"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 uppercase">
            CyberEmotion <span class="text-xs text-cyan-500 font-mono">v1.0</span>
          </h1>
          <p class="text-xs text-slate-400">Reconocimiento facial y análisis emocional en tiempo real</p>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <div id="status-badge" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-mono bg-slate-800 text-slate-400 border border-slate-700">
          <span class="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
          <span>Iniciando sistema...</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Columna Izquierda: Video Feed -->
    <div class="lg:col-span-2 flex flex-col gap-4">
      <div class="relative bg-slate-900/80 border border-cyan-900/50 rounded-xl overflow-hidden shadow-2xl min-h-[380px] sm:min-h-[480px] flex items-center justify-center group">
        
        <!-- Video & Canvas Container -->
        <div class="relative w-full h-full flex items-center justify-center overflow-hidden">
          <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover transform -scale-x-100 hidden"></video>
          <canvas id="overlay" class="absolute top-0 left-0 w-full h-full transform -scale-x-100 pointer-events-none"></canvas>
        </div>

        <!-- Overlay de Carga -->
        <div id="loader" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-20">
          <div class="relative w-16 h-16 mb-4">
            <div class="absolute inset-0 rounded-full border-4 border-cyan-500/20 border-t-cyan-400 animate-spin"></div>
            <div class="absolute inset-2 rounded-full border-4 border-emerald-500/20 border-b-emerald-400 animate-spin" style="animation-direction: reverse; animation-duration: 1.5s;"></div>
          </div>
          <p id="loader-text" class="font-mono text-sm text-cyan-400 tracking-wide">Cargando modelos de IA...</p>
        </div>

        <!-- Watermark/Cyber Effect -->
        <div class="absolute top-4 left-4 pointer-events-none text-[10px] font-mono text-cyan-500/50 flex flex-col gap-1">
          <span>SYS_STATUS: ACTIVE</span>
          <span>CAMERA_STREAM: READY</span>
        </div>
      </div>

      <!-- Controles -->
      <div class="flex flex-wrap gap-4 items-center justify-between bg-slate-900/60 p-4 border border-slate-800 rounded-xl">
        <button id="btn-toggle-cam" disabled class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-cyan-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded-lg text-sm transition-all duration-200 shadow-[0_0_15px_rgba(6,182,212,0.3)]">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>Iniciar Cámara</span>
        </button>

        <div class="flex items-center gap-3 text-xs font-mono text-slate-400">
          <label class="flex items-center gap-2 cursor-pointer hover:text-slate-200">
            <input type="checkbox" id="chk-landmarks" checked class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-cyan-500">
            <span>Puntos Faciales</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-slate-200">
            <input type="checkbox" id="chk-expressions" checked class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-cyan-500">
            <span>Etiquetas</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Panel de Estadísticas -->
    <div class="flex flex-col gap-4">
      
      <!-- Resumen Global -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 shadow-lg">
        <h2 class="text-sm font-semibold tracking-wider text-cyan-400 uppercase mb-4 flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4"></i> Detección en Tiempo Real
        </h2>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
            <span class="text-xs text-slate-400 font-mono block">ROSTROS</span>
            <span id="face-count" class="text-2xl font-bold text-slate-100 font-mono">0</span>
          </div>
          <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
            <span class="text-xs text-slate-400 font-mono block">FPS</span>
            <span id="fps-counter" class="text-2xl font-bold text-emerald-400 font-mono">0</span>
          </div>
        </div>
      </div>

      <!-- Desglose de Emociones -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-5 shadow-lg flex-1 flex flex-col">
        <h2 class="text-sm font-semibold tracking-wider text-cyan-400 uppercase mb-4 flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4"></i> Estado Anímico Principal
        </h2>
        <div id="emotions-container" class="space-y-3 flex-1 flex flex-col justify-center">
          <div class="text-center text-xs text-slate-500 py-8">
            En espera de señal de video...
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Carga de Módulos JS -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
